{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockPortal | Premium Exam Experience</title>
    <meta name="description" content="A state-of-the-art online mock test portal for competitive exams.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'quiz/style.css' %}">
</head>
<body class="dark-theme">
    <!-- Background Elements -->
    <div class="blob-bg blob-1"></div>
    <div class="blob-bg blob-2"></div>
    <div class="blob-bg blob-3"></div>

    <div id="app">
        <!-- Navigation -->
        <nav class="nav-glass">
            <div class="nav-container">
                <a href="#home" class="nav-logo" id="nav-logo">
                    <span class="logo-icon"><i class="fas fa-bolt"></i></span>
                    <span class="logo-text">MockPortal</span>
                </a>
                
                <div class="nav-links" id="nav-links">
                    <!-- Dynamic Links (Home, Dashboard, Logout etc) -->
                </div>

                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content Area (Views are injected here) -->
        <main id="main-content" class="fade-in">
            <!-- Content Injected via JS -->
            <div class="loader-container">
                <div class="premium-loader"></div>
            </div>
        </main>

        <!-- Notification Toast System -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Modal System -->
        <div id="modal-overlay" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Mock Test Question Paper</h2>
                    <button class="btn-close" id="modal-close">&times;</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- Dynamic Modal Content -->
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <footer class="glass-footer">
            <div class="footer-content">
                <p>&copy; 2026 MockPortal. Designed for Excellence.</p>
            </div>
        </footer>
    </div>

    <!-- App Logic -->
    <script src="{% static 'quiz/app.js' %}?v=1.7" defer></script>
</body>
</html>
